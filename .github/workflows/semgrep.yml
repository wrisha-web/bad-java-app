name: Semgrep

on:
  pull_request: {}
  push:
    branches: ["main", "master"]
  schedule:
    - cron: '0 0 * * 0'  # Weekly full scan

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v3
      - run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
